version: "3"

vars:
  TOOLS_DIR: "{{.ROOT_DIR}}/tools/bin"

  PROTOC_GEN_GO: "{{.TOOLS_DIR}}/protoc-gen-go"
  PROTOC_GEN_GO_GRPC: "{{.TOOLS_DIR}}/protoc-gen-go-grpc"

  AUTH_PROTO_SRC: "{{.ROOT_DIR}}/api/proto/auth/v1/source"
  AUTH_PROTO_GEN: "{{.ROOT_DIR}}/api/proto/auth/v1/gen/go"

env:
  PATH:
    sh: echo "{{.TOOLS_DIR}}:$PATH"

tasks:
  tools:install:
    desc: download tools for build
    cmds:
      - mkdir -p {{.TOOLS_DIR}}
      - GOBIN={{.TOOLS_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - GOBIN={{.TOOLS_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - GOBIN={{.TOOLS_DIR}} go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - GOBIN={{.TOOLS_DIR}} go install golang.org/x/lint/golint@latest

  tools:uninstall:
    desc: uninstall tools for build
    cmds:
      - rm -rf {{.TOOLS_DIR}}

  gen:protoc:all:
    desc: gen proto files for all microservices
    cmds:
      - go build ./...
      - echo "Build complete"

  gen:protoc:gateway:
    desc: gen proto files for api-gateway
    cmds:
      - echo "Build complete"

  gen:protoc:auth:
    desc: gen proto files for auth
    cmds:
      - rm -rf {{.AUTH_PROTO_GEN}}
      - mkdir -p {{.AUTH_PROTO_GEN}}
      - >-
        protoc
        --proto_path={{.AUTH_PROTO_SRC}}
        --plugin=protoc-gen-go={{.PROTOC_GEN_GO}}
        --plugin=protoc-gen-go-grpc={{.PROTOC_GEN_GO_GRPC}}
        --go_out={{.AUTH_PROTO_GEN}} --go_opt=paths=source_relative
        --go-grpc_out={{.AUTH_PROTO_GEN}} --go-grpc_opt=paths=source_relative
        $(find {{.AUTH_PROTO_SRC}} -name '*.proto')

  gen:protoc:notification:
    desc: gen proto files for notification

  gen:protoc:search:
    desc: gen proto files for search

  gen:protoc:transcoding:
    desc: gen proto files for transcoding

  gen:protoc:upload:
    desc: gen proto files for upload

  gen:protoc:video:
    desc: gen proto files for updoad
